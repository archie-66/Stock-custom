name: 每日更新台股資料

on:
  schedule:
    # 台北時間 13:37～17:52 每 15 分鐘（週一～五）。GitHub 常常會漏跑排程，
    # 所以只要有任何一次啟動，它就會自己每 5 分鐘再檢查，直到當天資料完整為止。
    - cron: "37,52 5 * * 1-5"
    - cron: "7,22,37,52 6-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓證交所資料（每 5 分鐘一次，直到完整）
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          for i in $(seq 1 40); do
            git pull -q --rebase origin main || true
            FORCE="${{ github.event_name == 'workflow_dispatch' && '1' || '' }}" python update.py || true
            if ! git diff --quiet -- data.json; then
              git add data.json
              git commit -q -m "更新台股資料 $(TZ=Asia/Taipei date '+%F %H:%M')"
              git pull -q --rebase origin main && git push -q || echo "push 失敗，下一輪再試"
            fi
            STATE=$(python -c "
          import json,datetime as dt
          now=dt.datetime.utcnow()+dt.timedelta(hours=8);today=now.strftime('%Y-%m-%d');m=now.hour*60+now.minute
          try: d=json.load(open('data.json'))
          except Exception: d={}
          if d.get('date')==today and d.get('complete'): print('DONE')
          elif m>=18*60: print('DONE')
          elif m>=15*60 and d.get('date')!=today: print('DONE')
          else: print('WAIT')")
            echo "第 $i 次檢查：$STATE"
            [ "$STATE" = "DONE" ] && break
            sleep 300
          done
      - name: 拿出訓練用的長期資料（存在 GitHub 快取，不放網站）
        uses: actions/cache/restore@v4
        with:
          path: train-tw.json
          key: train-tw-${{ github.run_id }}
          restore-keys: train-tw-
      - name: 更新預測用的歷史資料（網站 60 天、訓練用約 1 年）
        run: |
          for i in 1 2 3 4 5 6; do python hist.py || true; done
      - name: 存回快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: train-tw.json
          key: train-tw-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 訓練預測模型
        run: |
          pip install -q numpy pandas scikit-learn
          python model.py tw || echo "模型訓練失敗"
      - name: 存檔
        run: |
          git add pred-tw.json 2>/dev/null || true
          if [ -n "$(git status --porcelain hist.json pred-tw.json)" ]; then
            git add hist.json pred-tw.json
            git commit -q -m "更新預測歷史資料 $(TZ=Asia/Taipei date '+%F %H:%M')"
            git pull -q --rebase origin main && git push -q || echo "push 失敗"
          fi
